<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kage Proxy</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <form id="nav" autocomplete="off">
      <button type="button" id="back" title="戻る">←</button>
      <button type="button" id="fwd" title="進む">→</button>
      <button type="button" id="reload" title="再読み込み">⟳</button>
      <input id="addr" type="text" spellcheck="false"
             placeholder="example.com または https://example.com" />
      <button type="submit">移動</button>
    </form>
    <div id="progress"></div>
  </header>

  <main>
    <section id="home">
      <h1>Kage Proxy</h1>
      <p>URL を入れて移動。HTML と CSS はサーバー側で書き換えて中継します。</p>
      <div class="links">
        <button data-url="https://example.com">example.com</button>
        <button data-url="https://ja.wikipedia.org">Wikipedia</button>
        <button data-url="https://news.ycombinator.com">Hacker News</button>
        <button data-url="https://lite.duckduckgo.com/lite/">DuckDuckGo</button>
        <button data-url="https://text.npr.org">NPR Text</button>
        <button data-url="https://old.reddit.com">old.reddit</button>
      </div>
    </section>
    <iframe id="frame" title="proxy view"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups
               allow-modals allow-downloads allow-top-navigation-by-user-activation"
      referrerpolicy="no-referrer"></iframe>
  </main>

  <script src="/app.js"></script>
</body>
</html>
